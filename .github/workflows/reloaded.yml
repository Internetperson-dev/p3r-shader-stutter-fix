name: Build P3R Shader Preload + DLL

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PUBLISH_COMMON_PATH: ./Publish/ToUpload/
  PUBLISH_GAMEBANANA_PATH: ./Publish/ToUpload/GameBanana
  PUBLISH_GITHUB_PATH: ./Publish/ToUpload/Generic
  PUBLISH_NUGET_PATH: ./Publish/ToUpload/NuGet
  PUBLISH_CHANGELOG_PATH: ./Publish/Changelog.md
  PUBLISH_PATH: ./Publish
  RELOADEDIIMODS: .
  NUGET_URL: https://packages.sewer56.moe/v3/index.json
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: 'recursive'

    - name: Setup .NET SDK (9.0)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Setup MSVC (CMake)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build Proxy DLL (d3d12.dll)
      run: |
        cmake -S DLL-SCSKiller/proxy -B DLL-SCSKiller/proxy/build -A x64 '-DSCSK_VERSION=1.0.0'
        cmake --build DLL-SCSKiller/proxy/build --config Release

    - name: Build Reloaded-II Mod
      run: ./P3R.ShaderPreload/Publish.ps1 -ChangelogPath "$env:PUBLISH_CHANGELOG_PATH"

    - name: Package Combined Output
      run: |
        New-Item -ItemType Directory -Force -Path "./Publish/Combined" | Out-Null
        # Copy proxy DLL
        Copy-Item "DLL-SCSKiller/proxy/build/Release/d3d12.dll" "./Publish/Combined/d3d12.dll" -ErrorAction SilentlyContinue
        Copy-Item "DLL-SCSKiller/proxy/build/Release/d3d12.pdb" "./Publish/Combined/d3d12.pdb" -ErrorAction SilentlyContinue
        # Copy Reloaded-II mod output
        Get-ChildItem -Path "$env:PUBLISH_GITHUB_PATH" -Recurse | Copy-Item -Destination "./Publish/Combined/" -Force -Recurse -ErrorAction SilentlyContinue

    - name: Upload Combined Artifact
      uses: actions/upload-artifact@v4
      with:
        name: P3R-Shader-Preload-Combined
        path: ./Publish/Combined/
        retention-days: 30
