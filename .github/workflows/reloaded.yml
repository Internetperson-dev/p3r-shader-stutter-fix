name: Build Reloaded Mod

# Versioning and releases
# -----------------------
# Every successful build on `main` becomes a release. The version is the highest existing
# `vMAJOR.MINOR.PATCH` tag with the patch bumped, unless `ModVersion` in ModConfig.json is higher
# (that is how you bump the minor or major version deliberately). The tag and release are created
# with the workflow's GITHUB_TOKEN, so they do not trigger another workflow run.
#
# Pushing a `v*` tag builds that exact version and (re)attaches the zip to that release.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  RELOADEDIIMODS: ${{ github.workspace }}\Publish\reloaded-mods

  # The upstream SCSKiller release whose CLI is modified (the `prewarm` command) and whose D3D12 warm shims are bundled.
  SCSKILLER_VERSION: '1.4.7'
  SCSKILLER_URL: 'https://github.com/BlueHeisenberg/SCSKiller/releases/download/v1.4.7/SCSKiller.zip'
  SCSKILLER_SHA256: 'fcfd82e940a73ed5f7d72e51e8c460cf7cc3c6ec37fd734bf51723b12faab8d3'

permissions:
  contents: write

# Serialise builds per ref so two pushes to main cannot pick the same next version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Determine version
      id: version
      run: |
        $configPath = 'P3R.ShaderPreload/ModConfig.json'
        $config = Get-Content $configPath -Raw | ConvertFrom-Json
        $base = [version]$config.ModVersion

        $isTag = $env:GITHUB_REF -like 'refs/tags/*'
        $isMain = $env:GITHUB_REF -eq 'refs/heads/main'
        $release = $isTag -or $isMain

        if ($isTag) {
          # A tag push builds exactly the tagged version.
          $tag = $env:GITHUB_REF.Substring('refs/tags/'.Length)
          $candidate = $tag -replace '^[vV]', ''
          if ($candidate -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not a vMAJOR.MINOR.PATCH release tag."
          }
          $version = [version]$candidate
        }
        elseif ($release) {
          # Next release: highest tag + 1 patch, or the ModConfig base when that is newer.
          $tags = @(
            git tag --list 'v*' |
              ForEach-Object { $_ -replace '^[vV]', '' } |
              Where-Object { $_ -match '^\d+\.\d+\.\d+$' } |
              ForEach-Object { [version]$_ } |
              Sort-Object
          )
          $highest = if ($tags.Count -gt 0) { $tags[-1] } else { $null }

          if ($null -eq $highest -or $base -gt $highest) {
            $version = $base
          }
          else {
            $version = [version]::new($highest.Major, $highest.Minor, $highest.Build + 1)
          }
        }
        else {
          # Pull requests build the checked-in version without releasing it.
          $version = $base
        }

        $versionText = $version.ToString(3)
        $tagName = "v$versionText"

        # Keep the packaged and published metadata in sync with the version being built.
        $config.ModVersion = $versionText
        $config | ConvertTo-Json -Depth 10 | Set-Content -Path $configPath -Encoding utf8

        "version=$versionText" >> $env:GITHUB_OUTPUT
        "tag=$tagName" >> $env:GITHUB_OUTPUT
        "release=$($release.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
        "name=P3R.ShaderPreload-$versionText" >> $env:GITHUB_OUTPUT

        Write-Host "Building $versionText (tag $tagName, release: $release)"

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          9.0.x
          10.0.x

    - name: Download and verify SCSKiller
      run: |
        $zip = Join-Path $env:RUNNER_TEMP 'SCSKiller.zip'
        Invoke-WebRequest -Uri $env:SCSKILLER_URL -OutFile $zip
        $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
        if ($actual -ne $env:SCSKILLER_SHA256) {
          throw "SCSKiller.zip SHA-256 mismatch: expected $env:SCSKILLER_SHA256, got $actual"
        }

        # The archive stores backslash-separated entry names, which Expand-Archive does not always treat as folders.
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $extract = Join-Path $env:RUNNER_TEMP 'SCSKiller'
        New-Item -ItemType Directory -Force -Path $extract | Out-Null
        $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
        try {
          foreach ($entry in $archive.Entries) {
            $relative = $entry.FullName.Replace('\', '/')
            $destination = Join-Path $extract $relative
            if ([string]::IsNullOrEmpty($entry.Name)) {
              New-Item -ItemType Directory -Force -Path $destination | Out-Null
              continue
            }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $destination, $true)
          }
        } finally {
          $archive.Dispose()
        }

    - name: Publish the modified SCSKiller CLI
      run: |
        dotnet publish DLL-SCSKiller/src/SCSKiller.Cli/SCSKiller.Cli.csproj `
          -c Release `
          -p:Version=$env:SCSKILLER_VERSION `
          -o Publish/cli

    - name: Smoke-test the CLI
      run: |
        & .\Publish\cli\scskiller.exe --version
        if ($LASTEXITCODE -ne 0) { throw "scskiller --version failed with exit code $LASTEXITCODE" }

    - name: Stage the prewarm helper
      run: |
        $prewarm = 'P3R.ShaderPreload/prewarm'
        $source = Join-Path $env:RUNNER_TEMP 'SCSKiller/SCSKiller'
        New-Item -ItemType Directory -Force -Path "$prewarm/cli", "$prewarm/native/segheap" | Out-Null

        # The CLI itself, then the pinned zlib-ng2.dll from the official build (Oodle is downloaded at first use).
        Copy-Item -Path 'Publish/cli/*' -Destination "$prewarm/cli" -Recurse -Force
        Copy-Item -Path "$source/cli/zlib-ng2.dll" -Destination "$prewarm/cli/zlib-ng2.dll" -Force

        # The D3D12 warm harness. NVIDIA warms faster on the segment heap, so both variants are bundled.
        Copy-Item -Path "$source/native/scskiller_warm.exe" -Destination "$prewarm/native/scskiller_warm.exe" -Force
        Copy-Item -Path "$source/native/segheap/scskiller_warm.exe" -Destination "$prewarm/native/segheap/scskiller_warm.exe" -Force
        Copy-Item -Path "$source/native/d3d12.dll" -Destination "$prewarm/native/d3d12.dll" -Force
        Copy-Item -Path "$source/native/amd_ags_x64.dll" -Destination "$prewarm/native/amd_ags_x64.dll" -Force
        Copy-Item -Path "$source/native/scskiller_ags.dll" -Destination "$prewarm/native/scskiller_ags.dll" -Force

        # Upstream notices, so the bundled binaries keep their licence text with them.
        Copy-Item -Path "$source/LICENSE" -Destination "$prewarm/SCSKILLER-LICENSE.txt" -Force
        Copy-Item -Path "$source/LICENSE-EXCEPTION.txt" -Destination "$prewarm/SCSKILLER-LICENSE-EXCEPTION.txt" -Force

    - name: Publish the Reloaded mod
      run: |
        dotnet publish P3R.ShaderPreload/P3R.ShaderPreload.csproj `
          -c Release `
          --self-contained false `
          -p:Version=${{ steps.version.outputs.version }} `
          -o Publish/mod

    - name: Package
      id: package
      env:
        MOD_NAME: ${{ steps.version.outputs.name }}
      run: |
        $zip = "Publish/$env:MOD_NAME.zip"
        Compress-Archive -Path 'Publish/mod/*' -DestinationPath $zip -Force
        $configVersion = (Get-Content P3R.ShaderPreload/ModConfig.json -Raw | ConvertFrom-Json).ModVersion
        if ($configVersion -ne "${{ steps.version.outputs.version }}") {
          throw "Packaged ModConfig.json says $configVersion, expected ${{ steps.version.outputs.version }}"
        }
        "zip=$zip" >> $env:GITHUB_OUTPUT

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.name }}
        path: ${{ steps.package.outputs.zip }}
        retention-days: 30

    # Creates the tag and release on main pushes, or updates the tagged release on tag pushes.
    - name: Publish release
      if: steps.version.outputs.release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        files: ${{ steps.package.outputs.zip }}
        generate_release_notes: true
